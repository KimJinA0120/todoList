server:
  port: 8080

spring:
  application:
  name: JPAbackend

  # MySQL ?? (?? ?? ???? ??)
  datasource:
    url: jdbc:mysql://localhost:3306/tododb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
    username: todouser
    password: todopassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate ??
  jpa:
    hibernate:
      ddl-auto: update # ?? ????? update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100

  # Redis ??
  data:
    redis:
      host: localhost
      port: 6379

  # Mailpit (?? ??) ??
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Swagger (Springdoc OpenAPI) ??
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operationsSorter: method